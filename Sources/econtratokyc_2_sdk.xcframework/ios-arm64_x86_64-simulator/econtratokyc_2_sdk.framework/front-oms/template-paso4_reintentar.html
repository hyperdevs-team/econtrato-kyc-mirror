<!DOCTYPE html>
<html lang="es">
<head>

  <link href="css/#CSS_STYLESHEET" rel="stylesheet">
</head>
<body class="#BRAND_STYLE-cms" onload="loadBreadcrumb('Validar')">
  <div class="container-fluid-flex">  
        <div class="row-flex">
            <div class="box bg-lightgrey">
              <div class="container-flex">
                <div class="col-flex-xs-12 col-flex-sm-12 col-flex-md-12 col-flex-lg-12">
                  <div class="step-form-counter">
                    <div class="step-container">
                      <div class="step completed">
                        <div class="step-number">
                          <span class="number">1</span>
                          <div class="tick"></div>
                        </div>
                        <span class="step-title">Capturar anverso</span>
                      </div>
                      <div class="step completed">
                        <div class="step-number">
                          <span class="number">2</span>
                          <div class="tick"></div>
                        </div>
                        <span class="step-title">Capturar reverso</span>
                      </div>
                      <div class="step completed">
                        <div class="step-number">
                          <span class="number">3</span>
                          <div class="tick"></div>
                        </div>
                        <span class="step-title">Validar</span>
                      </div>
                      <div class="step current">
                        <div class="step-number">
                          <span class="number">4</span>
                          <div class="tick"></div>
                        </div>
                        <span class="step-title">Fin</span>
                      </div>
                    </div>
                    <div class="step-progress">
                      <div class="progress" style="width: 100%;">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
        </div>
        <div class="row-flex">
          <div class="box mod-cases">
            <div class="container-flex">
              <div class="col-flex-xs-12 col-flex-sm-12 col-flex-md-12 col-flex-lg-12">
                <h1 class="title-page">
                  <span class="font-sm">
                    Captura de documentos
                  </span>
                </h1>
              </div>
            </div>
          </div>
        </div>

                <div class="col-flex-xs-12 col-flex-sm-12 col-flex-md-12 col-flex-lg-12">

                      <div class="message">
                          <div class="message-info">
                              <p class="title">El documento no se ha podido validar</p>
                              <p>#CLASSIFICATIONMESSAGE_TEXT</p>
                            </div>
                      </div>
					</div>

                  <div class="btn-group pull-left">
                    <button id="cerrarReintentar"
                        onclick="cerrarReintentar()"
                        title="link title"
                        class="btn btn-md btn-default" >
                    Cancelar
                    </button>
                </div>
					
                <div class="btn-group  pull-right">
                  <button id="reintentarResult"
                      onclick="reintentarResult()"
                      class="btn btn-primary btn-md sendButton"
                      title="reintentar captura"
                      type="submit" value="Reintentar">Reintentar</button>

				</div>
              </div>
